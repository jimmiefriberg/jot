<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Olive body: lighter top-left, deeper bottom-right -->
    <linearGradient id="body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#9aa955"/>
      <stop offset="0.55" stop-color="#6f7f34"/>
      <stop offset="1" stop-color="#4a5821"/>
    </linearGradient>
    <!-- Soft light pooling in the top-left corner -->
    <radialGradient id="glow-top-left" cx="0.2" cy="0.12" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Reflected light in the bottom-right corner -->
    <radialGradient id="glow-bottom-right" cx="0.9" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#d9e69a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d9e69a" stop-opacity="0"/>
    </radialGradient>
    <!-- Thin rim: bright at top-left and bottom-right, fading in between -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="letter-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shape"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <rect x="100" y="100" width="824" height="824" fill="url(#body)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow-top-left)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow-bottom-right)"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- A typewriter slab-serif T: crossbar with drop serifs, monoline stem, wide foot -->
  <g filter="url(#letter-shadow)" fill="#ffffff">
    <rect x="290" y="296" width="444" height="70" rx="10"/>
    <rect x="290" y="296" width="62" height="138" rx="10"/>
    <rect x="672" y="296" width="62" height="138" rx="10"/>
    <rect x="477" y="296" width="70" height="434" rx="10"/>
    <rect x="378" y="668" width="268" height="62" rx="10"/>
  </g>
</svg>
