# A typical config file
name: inventory-service
version: 1.2.0
server:
  host: localhost
  port: 8080
  tls: false
features:
  - search
  - exports
  - audit-log
database:
  url: postgres://localhost/example
  pool:
    minimum: 2
    maximum: 10
description: |
  A multi-line string
  kept as written.
anchors:
  defaults: &defaults
    retries: 3
  production:
    <<: *defaults
    retries: 5
